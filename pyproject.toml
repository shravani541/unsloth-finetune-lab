[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fasttune-lab"
version = "1.0.0"
authors = [
    { name = "FastTune-Lab Contributors" }
]
description = "Accelerated LLM Fine-Tuning, Benchmarking & Deployment Suite powered by Unsloth"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "accelerate>=0.28.0",
    "peft>=0.10.0",
    "trl>=0.8.6",
    "bitsandbytes>=0.43.0",
    "gradio>=4.20.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.1",
]
